[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcplint-cli"
dynamic = ["version"]
description = "Lint and benchmark MCP tool contracts before ambiguous descriptions break LLM tool selection."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
  { name = "Akash Kokare", email = "akashkokare2017@gmail.com" },
]
keywords = [
  "mcp",
  "model-context-protocol",
  "llm",
  "agent",
  "lint",
  "tool-calling",
  "evaluation",
  "ai",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.12",
  "pydantic>=2.7",
  "mcp>=1.28",
  "jsonschema>=4.22",
  "rich>=13.7",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "httpx>=0.27",
  "anyio>=4.4",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.34"]
openai = ["openai>=1.40"]
semantic = ["sentence-transformers>=3.0"]
dev = [
  "anthropic>=0.34",
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-pyyaml",
  "types-jsonschema",
]

[project.urls]
Homepage = "https://github.com/akashkokare2910/mcplint"
Repository = "https://github.com/akashkokare2910/mcplint"
Issues = "https://github.com/akashkokare2910/mcplint/issues"
Changelog = "https://github.com/akashkokare2910/mcplint/blob/main/CHANGELOG.md"

[project.scripts]
mcplint = "mcplint.cli.main:app"

[tool.hatch.version]
path = "src/mcplint/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mcplint"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "slow: builds a real wheel and creates a real venv; excluded from the default run, opt in with -m slow",
]
addopts = "-m 'not slow'"
