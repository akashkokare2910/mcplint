# Behavioral contract for examples/ambiguous_customer_server.
#
# This server's descriptions are deliberately weak (see server.py's own
# docstring) — that's the point. This contract states what SHOULD be true
# so that mutation testing and adversarial benchmarking have a real,
# non-trivial target: several mutators applied to this server are expected
# to "survive" (i.e. the descriptions are already too weak to detect
# further regression), which is itself the demonstration.
schema_version: "1"
name: ambiguous-customer-server
description: Behavioral semantics for the intentionally ambiguous customer tools.

tools:
  get_customer:
    intent:
      operation: read
      cardinality: one
      matching: exact
      side_effects: none
      risk: low

    requires:
      - customer_id

    returns:
      cardinality: one
      entity: customer

    prefer_over:
      search_customers:
        when: A known, exact customer ID is supplied.

    avoid_when:
      - The user does not have the exact customer ID.

    expected_failures:
      - customer_not_found

  search_customers:
    intent:
      operation: read
      cardinality: many
      matching: partial
      side_effects: none
      risk: low

    requires:
      - customer_id

    returns:
      cardinality: many
      entity: customer

    prefer_over:
      get_customer:
        when: The user wants to search or browse rather than look up one known ID.

    avoid_when:
      - The user already has the exact customer ID and wants a single record.

  update_customer:
    intent:
      operation: update
      cardinality: one
      matching: exact
      side_effects: internal
      risk: medium

    requires:
      - customer_id

    excludes:
      - query

    returns:
      cardinality: one
      entity: customer

    avoid_when:
      - The user only wants to look up or read customer data.

    expected_failures:
      - customer_not_found
      - validation_error

  delete_customer:
    intent:
      operation: delete
      cardinality: one
      matching: exact
      side_effects: external
      risk: high

    requires:
      - customer_id

    excludes:
      - query

    avoid_when:
      - The user has not explicitly confirmed permanent deletion.
      - The user wants to read or update rather than remove data.

    expected_failures:
      - customer_not_found
